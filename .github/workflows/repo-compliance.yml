name: Repository Compliance & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  compliance-audit:
    name: Compliance & Architecture Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (for compliance & quality gates)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Verify repository compliance & enforcement
        run: |
          node scripts/verify-compliance.js
          pwsh scripts/verify-compliance.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Outbox.slnx

      - name: Build with Strict Diagnostics (TreatWarningsAsErrors)
        run: dotnet build EricksonLopez.Outbox.slnx --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test EricksonLopez.Outbox.slnx --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~IntegrationTests"

      - name: Validate NuGet Packages Packaging
        run: dotnet pack EricksonLopez.Outbox.slnx --no-build --configuration Release -o artifacts/
