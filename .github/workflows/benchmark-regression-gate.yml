name: Benchmark Regression Gate

# â”€â”€â”€ Purpose â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Runs BenchmarkDotNet against the PR branch and validates against strict gates:
#   1. Heap Invariant: Zero-allocation on hot path combinators (0 B allocated).
#   2. Latency Threshold: Mean latency regression must not exceed 5% vs baseline.
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - "src/**"
      - "benchmarks/**"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold in percent (default: 5)"
        required: false
        default: "5"
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  REGRESSION_THRESHOLD: ${{ inputs.threshold || '5' }}

jobs:
  benchmark-gate:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
          fi

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Outbox.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Outbox.slnx --no-restore --configuration Release

      - name: Run benchmarks (PR head)
        run: >
          dotnet run
          --project benchmarks/EricksonLopez.Outbox.Benchmarks/EricksonLopez.Outbox.Benchmarks.csproj
          --configuration Release
          --framework net10.0
          --
          --filter "*"
          --job short
          --exporters json
          --memory
          --artifacts ./benchmarks/pr-results

      - name: Evaluate Benchmark Regression Gate
        shell: pwsh
        run: |
          ./scripts/verify-benchmark-gate.ps1 `
            -ReportDir ./benchmarks/pr-results `
            -BaselinePath ./benchmarks/results/baseline.json `
            -MaxLatencyRegressionPercent ([double]$env:REGRESSION_THRESHOLD)

      - name: Upload PR benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-benchmark-results-${{ github.run_id }}
          path: benchmarks/pr-results/
          retention-days: 30
